name: Feature request
description: Suggest a maintainer workflow improvement.
title: "Feature: "
labels: ["enhancement", "needs triage"]
body:
  - type: textarea
    id: workflow
    attributes:
      label: Maintainer workflow
      description: What maintenance task should this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Maintainer Sentinel do?
    validations:
      required: true
